<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#254a38" />
    <title>MediMate — offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f5ed; color: #243b30;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
      main { max-width: 26rem; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 1.5rem; margin: 1rem 0 0.5rem; }
      p { line-height: 1.6; color: #5b6b61; }
      button { margin-top: 1rem; min-height: 44px; padding: 0 1.25rem; border-radius: 999px; border: 0;
        background: #254a38; color: #fff; font-size: 1rem; cursor: pointer; }
      button:focus-visible { outline: 3px solid #bd7e3e; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>MediMate needs an internet connection to load your profile, logs and reminders. Check your connection and try again.</p>
      <p>If you feel very unwell or think it's an emergency, call your local emergency number.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
